name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Abhängigkeiten
        run: python -m pip install -e ".[dev]"
      - name: Tests mit Abdeckung
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

  live:
    # Holt die echten Quellen und erzeugt die Profile so wie bei Benutzern.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Quellen holen und Profile erzeugen
        run: python bfp.py update
      - name: Profile sind lesbar
        run: python bfp.py list --vendor Geeetech
