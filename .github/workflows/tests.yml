name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # Users always fetch the newest sources, so check them weekly even without commits.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependencies
        run: python -m pip install -e ".[dev]"
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

  live:
    # Fetches the real sources and builds the profiles just like on a user's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch sources and build profiles
        run: python bfp.py update
      - name: Profiles are readable
        run: python bfp.py list --vendor Geeetech
