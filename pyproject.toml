[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-filament-profiles"
version = "0.2.1"
description = "Builds Bambu Studio filament profiles from open filament databases and installs them sorted by brand"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bfp = "bambu_filament_profiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bambu_filament_profiles = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["bambu_filament_profiles"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
