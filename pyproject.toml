[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-filament-profiles"
version = "0.1.1"
description = "Erzeugt Bambu-Studio-Filamentprofile aus offenen Filamentdatenbanken und installiert sie nach Hersteller sortiert"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bfp = "bambu_filament_profiles.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["bambu_filament_profiles"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
